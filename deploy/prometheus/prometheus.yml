global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # 1. Backend REST API Metrics
  - job_name: "blockescrow-backend"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"]
        labels:
          environment: "production"
          service: "api"

  # 2. Blockchain Indexer Metrics
  - job_name: "blockescrow-indexer"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"] # Combined telemetry server
        labels:
          environment: "production"
          service: "indexer"
