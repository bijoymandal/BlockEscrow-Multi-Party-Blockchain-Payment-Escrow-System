name: CI & Protocol Verification

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Protocol Test Suites (Contracts, IPFS, Backend, Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Workspace Dependencies
        run: |
          npm install
          npm install --prefix contracts
          npm install --prefix packages/ipfs-service
          npm install --prefix backend
          npm install --prefix frontend

      - name: Compile Smart Contracts
        run: npm run compile

      - name: Execute Full Test Suite (90 Tests)
        run: npm test
