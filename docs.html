  <script>
    const docs = {"architecture.md":"# BlockEscrow – System Architecture Specification (`architecture.md`)\n\n> **Document Version:** 1.0.0  \n> **System Classification:** Multi-Party Non-Custodial Blockchain Escrow & Dispute Resolution Protocol  \n> **Target Networks:** Ethereum (EVM), Polygon PoS, Arbitrum One  \n> **Supported Assets:** Native (ETH/MATIC) and Standard ERC-20 Tokens (USDC, USDT, DAI)\n\n---\n\n## 1. High-Level Architecture Overview\n\nBlockEscrow is an enterprise-grade decentralized escrow platform designed to facilitate secure peer-to-peer and multi-party milestone payments. Off-chain business agreements are cryptographically bound to on-chain smart contracts via IPFS content addressing.\n\n```\n                    ┌─────────────────────────┐\n                    │     React / Next.js     │\n                    │      Frontend App       │\n                    │ (App Router + Wagmi v2) │\n                    └────────────┬────────────┘\n                                 │\n                     viem / EIP-1193 / EIP-712\n                                 │\n               ┌─────────────────▼─────────────────┐\n               │         Ethereum / Polygon        │\n               │                                   │\n               │       BlockEscrow Contract        │\n               │                                   │\n               │  • Create Escrow   • Milestones   │\n               │  • Lock Funds      • Dispute Res  │\n               │  • Release Funds   • Fee Engine   │\n               │  • Refund Engine   • Emergency    │\n               └─────────────────┬─────────────────┘\n                                 │\n                    WebSocket / JSON-RPC Events\n                                 │\n               ┌─────────────────▼─────────────────┐\n               │          Node.js API              │\n               │                                   │\n               │   Event Indexer / Reorg Engine    │\n               │   Business APIs / BullMQ Queues   │\n               └────────────┬────────────┬─────────┘\n                            │            │\n                   ┌────────▼───┐    ┌───▼─────────┐\n                   │ PostgreSQL │    │    Redis    │\n                   │  Database  │    │ Cache/Queue │\n                   └────────────┘    └─────────────┘\n                                 │\n                          ┌──────▼──────┐\n                          │    IPFS     │\n                          │ Agreements  │\n                          │ & Evidence  │\n                          └─────────────┘\n```\n\n---\n\n## 2. Smart Contract Architecture\n\nThe core on-chain protocol follows an upgradeable proxy pattern (UUPS) or modular diamond architecture, incorporating OpenZeppelin security standards.\n\n### 2.1 Contract Hierarchy & Inheritance\n\n```\nOpenZeppelin Contracts:\n├── Initializable\n├── ReentrancyGuardUpgradeable\n├── PausableUpgradeable\n├── AccessControlUpgradeable\n└── SafeERC20 / IERC20\n\nCustom Implementations:\n└── BlockEscrow.sol (Implements IBlockEscrow, IEscrowEvents, IDisputeManager)\n```\n\n### 2.2 Escrow State Machine\n\n```mermaid\nstateDiagram-v2\n    [*] --> DRAFT : Agreement Initialized\n    DRAFT --> FUNDED : Buyer Deposits Funds (Native / ERC-20)\n    FUNDED --> WORK_SUBMITTED : Seller Delivers Milestone\n    WORK_SUBMITTED --> FUNDED : Buyer Requests Revisions\n    WORK_SUBMITTED --> PARTIALLY_RELEASED : Buyer Approves Milestone\n    PARTIALLY_RELEASED --> COMPLETED : Final Milestone Released\n    \n    FUNDED --> DISPUTED : Buyer or Seller Raises Dispute\n    WORK_SUBMITTED --> DISPUTED : Buyer or Seller Raises Dispute\n    PARTIALLY_RELEASED --> DISPUTED : Dispute on Remaining Funds\n\n    DISPUTED --> RESOLVED_SELLER : Arbitrator Awards Seller\n    DISPUTED --> RESOLVED_BUYER : Arbitrator Awards Buyer (Refund)\n    DISPUTED --> RESOLVED_SPLIT : Arbitrator Approves Partial Split\n\n    FUNDED --> REFUNDED : Mutual Cancellation / Timeout Expired\n    COMPLETED --> [*]\n    RESOLVED_SELLER --> [*]\n    RESOLVED_BUYER --> [*]\n    RESOLVED_SPLIT --> [*]\n    REFUNDED --> [*]\n```\n\n### 2.3 On-Chain Data Structures\n\n```solidity\n// SPDX-License-Identifier: MIT\npragma solidity ^0.8.24;\n\nenum EscrowStatus {\n    DRAFT,\n    FUNDED,\n    IN_PROGRESS,\n    COMPLETED,\n    DISPUTED,\n    RESOLVED,\n    REFUNDED,\n    CANCELLED\n}\n\nenum MilestoneStatus {\n    PENDING,\n    SUBMITTED,\n    APPROVED,\n    DISPUTED\n}\n\nstruct Milestone {\n    uint256 milestoneId;\n    string title;\n    uint256 amount;\n    uint256 deadline;\n    MilestoneStatus status;\n    string submissionIpfsHash; // Deliverable proof\n    uint256 submittedAt;\n    uint256 approvedAt;\n}\n\nstruct EscrowAgreement {\n    uint256 escrowId;\n    address buyer;\n    address seller;\n    address arbitrator;\n    address tokenAddress; // address(0) for native ETH/MATIC\n    uint256 totalAmount;\n    uint256 remainingBalance;\n    uint256 feeBasisPoints; // e.g., 50 = 0.5%\n    string agreementIpfsHash; // Legal/technical terms\n    EscrowStatus status;\n    uint256 createdAt;\n    uint256 lockedUntil;\n    uint256 milestoneCount;\n}\n\nstruct DisputeRecord {\n    uint256 disputeId;\n    uint256 escrowId;\n    address initiator;\n    string reasonIpfsHash;\n    uint256 buyerAwardAmount;\n    uint256 sellerAwardAmount;\n    uint256 resolvedAt;\n    bool isResolved;\n}\n```\n\n### 2.4 Smart Contract Security Invariants\n\n1. **Conservation of Value:** At all times:\n   $$\\text{Contract Token Balance} \\ge \\sum \\text{Remaining Balances} + \\text{Unclaimed Protocol Fees}$$\n2. **Reentrancy Protection:** All external transfer calls invoke `nonReentrant` modifiers and strictly follow the **Checks-Effects-Interactions (CEI)** pattern.\n3. **Pull Over Push Payments:** Disputed awards and refunds are recorded in state balances and released through explicit user-triggered withdrawals or atomic safe transfers.\n4. **Decimals Handling:** Strict normalization for tokens like USDC (6 decimals) versus standard 18 decimal tokens.\n5. **Emergency Pausing:** When `paused() == true`, no new escrows can be created or funded. Fund withdrawals for already completed/resolved escrows remain accessible or governed by multi-sig timelocks.\n\n---\n\n## 3. Backend & Blockchain Event Indexing Engine\n\nThe backend operates as an event-driven microservice using **Node.js, TypeScript, PostgreSQL, and Redis**.\n\n```\n                   Blockchain RPC (WebSocket)\n                                │\n                        [Event Listener]\n                                │\n                     [Reorg Detection Engine]\n                   (Buffer: N Blocks Depth)\n                                │\n                      [BullMQ Job Queue]\n                                │\n                    ┌───────────┴───────────┐\n                    ▼                       ▼\n            [Postgres Writer]       [Redis Cache Purger]\n            (Event Sourced)         (Pub/Sub WebSockets)\n```\n\n### 3.1 Reorganization (Reorg) Resilience Engine\nPublic blockchains experience temporary chain forks. To prevent false off-chain state updates:\n- **Confirmation Depth:** \n  - Polygon PoS: 32 blocks (~64 seconds)\n  - Arbitrum One: 12 blocks (~3 seconds)\n  - Ethereum Mainnet: 12 blocks (~2.5 minutes)\n- **Two-Phase Commit Tracking:**\n  1. `UNCONFIRMED_EVENT`: Event picked up instantly at block $H$; status marked as pending in Redis and notified to UI via WebSockets.\n  2. `CONFIRMED_EVENT`: When block $H + \\text{depth}$ is finalized, transaction is persisted to PostgreSQL and final state is locked.\n  3. `REORG_DETECTED`: If the block hash at height $H$ diverges during validation, all intermediate updates are rolled back to the previous canonical block.\n\n### 3.2 Database Schema (PostgreSQL / Prisma)\n\n```prisma\ndatasource db {\n  provider = \"postgresql\"\n  url      = env(\"DATABASE_URL\")\n}\n\ngenerator client {\n  provider = \"prisma-client-js\"\n}\n\nenum Role {\n  BUYER\n  SELLER\n  ARBITRATOR\n  ADMIN\n}\n\nenum EscrowState {\n  DRAFT\n  FUNDED\n  IN_PROGRESS\n  COMPLETED\n  DISPUTED\n  RESOLVED\n  REFUNDED\n  CANCELLED\n}\n\nmodel User {\n  id              String      @id @default(uuid())\n  walletAddress   String      @unique\n  role            Role        @default(BUYER)\n  nonce           String      // For SIWE (Sign-In with Ethereum)\n  username        String?\n  email           String?\n  createdAt       DateTime    @default(now())\n  updatedAt       DateTime    @updatedAt\n  \n  buyerEscrows    Escrow[]    @relation(\"BuyerEscrows\")\n  sellerEscrows   Escrow[]    @relation(\"SellerEscrows\")\n  arbitrated      Escrow[]    @relation(\"ArbitratorEscrows\")\n}\n\nmodel Escrow {\n  id                  String       @id @default(uuid())\n  onChainEscrowId     Int?         @unique\n  networkChainId      Int\n  buyerAddress        String\n  sellerAddress       String\n  arbitratorAddress   String\n  tokenAddress        String       // \"0x0\" for native\n  totalAmount         Decimal      @db.Decimal(36, 18)\n  remainingBalance    Decimal      @db.Decimal(36, 18)\n  status              EscrowState  @default(DRAFT)\n  agreementIpfsHash   String\n  txHash              String?      @unique\n  blockNumber         BigInt?\n  createdAt           DateTime     @default(now())\n  updatedAt           DateTime     @updatedAt\n\n  buyer               User         @relation(\"BuyerEscrows\", fields: [buyerAddress], references: [walletAddress])\n  seller              User         @relation(\"SellerEscrows\", fields: [sellerAddress], references: [walletAddress])\n  arbitrator          User         @relation(\"ArbitratorEscrows\", fields: [arbitratorAddress], references: [walletAddress])\n  \n  milestones          Milestone[]\n  disputes            Dispute[]\n  auditLogs           AuditLog[]\n\n  @@index([buyerAddress])\n  @@index([sellerAddress])\n  @@index([status])\n  @@index([networkChainId, onChainEscrowId])\n}\n\nmodel Milestone {\n  id                  String       @id @default(uuid())\n  escrowId            String\n  onChainIndex        Int\n  title               String\n  description         String?\n  amount              Decimal      @db.Decimal(36, 18)\n  deadline            DateTime\n  status              String       @default(\"PENDING\")\n  deliverableIpfsHash String?\n  txHash              String?\n  \n  escrow              Escrow       @relation(fields: [escrowId], references: [id], onDelete: Cascade)\n\n  @@unique([escrowId, onChainIndex])\n}\n\nmodel Dispute {\n  id                  String       @id @default(uuid())\n  escrowId            String\n  onChainDisputeId    Int?\n  initiatorAddress    String\n  reasonIpfsHash      String\n  buyerAward          Decimal?     @db.Decimal(36, 18)\n  sellerAward         Decimal?     @db.Decimal(36, 18)\n  isResolved          Boolean      @default(false)\n  rulingNotes         String?\n  txHash              String?\n  createdAt           DateTime     @default(now())\n  resolvedAt          DateTime?\n\n  escrow              Escrow       @relation(fields: [escrowId], references: [id])\n}\n\nmodel EventCursor {\n  chainId             Int          @id\n  lastProcessedBlock  BigInt\n  updatedAt           DateTime     @updatedAt\n}\n\nmodel AuditLog {\n  id                  String       @id @default(uuid())\n  escrowId            String\n  action              String\n  actorAddress        String\n  payload             Json\n  timestamp           DateTime     @default(now())\n\n  escrow              Escrow       @relation(fields: [escrowId], references: [id])\n}\n```\n\n---\n\n## 4. IPFS Metadata & Off-Chain Document Engine\n\nTo maintain decentralization without inflating on-chain storage gas costs, all contractual details, deliverables, code hashes, and dispute claims are stored on IPFS.\n\n### 4.1 Agreement Metadata Schema (`agreement.schema.json`)\n```json\n{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\",\n  \"title\": \"BlockEscrowAgreement\",\n  \"type\": \"object\",\n  \"properties\": {\n    \"version\": { \"type\": \"string\", \"enum\": [\"1.0.0\"] },\n    \"title\": { \"type\": \"string\", \"maxLength\": 120 },\n    \"description\": { \"type\": \"string\" },\n    \"buyer\": { \"type\": \"string\", \"pattern\": \"^0x[a-fA-F0-9]{40}$\" },\n    \"seller\": { \"type\": \"string\", \"pattern\": \"^0x[a-fA-F0-9]{40}$\" },\n    \"arbitrator\": { \"type\": \"string\", \"pattern\": \"^0x[a-fA-F0-9]{40}$\" },\n    \"tokenSymbol\": { \"type\": \"string\" },\n    \"totalAmount\": { \"type\": \"string\" },\n    \"milestones\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"index\": { \"type\": \"integer\" },\n          \"title\": { \"type\": \"string\" },\n          \"deliverables\": { \"type\": \"string\" },\n          \"amount\": { \"type\": \"string\" },\n          \"dueDate\": { \"type\": \"string\", \"format\": \"date-time\" }\n        },\n        \"required\": [\"index\", \"title\", \"amount\", \"dueDate\"]\n      }\n    },\n    \"disputeTerms\": {\n      \"arbitrationFeeBps\": { \"type\": \"integer\" },\n      \"evidenceWindowDays\": { \"type\": \"integer\" }\n    },\n    \"attachments\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"name\": { \"type\": \"string\" },\n        \"cid\": { \"type\": \"string\" },\n        \"sha256\": { \"type\": \"string\" }\n      }\n    }\n  },\n  \"required\": [\"version\", \"title\", \"buyer\", \"seller\", \"totalAmount\", \"milestones\"]\n}\n```\n\n### 4.2 Dual-Pinning Architecture\n1. **Primary Node:** Dedicated IPFS Cluster node run on AWS/Kubernetes.\n2. **Secondary Fallback:** Automated pinning via **Pinata API** and **Web3.Storage / Filecoin**.\n3. **Gateway Redundancy:** Frontend reads via multiple gateways (`https://ipfs.io/ipfs/`, `https://gateway.pinata.cloud/ipfs/`, and private dedicated gateway).\n\n---\n\n## 5. End-to-End Interaction Sequences\n\n### 5.1 Escrow Creation & Funding Sequence\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Buyer\n    participant UI as Next.js Frontend\n    participant IPFS as Pinata / IPFS Node\n    participant SC as BlockEscrow.sol\n    participant Node as Node.js Indexer\n    participant DB as PostgreSQL\n\n    Buyer->>UI: Fill agreement details & milestones\n    UI->>IPFS: Pin agreement metadata JSON\n    IPFS-->>UI: Return CID (QmX7a...)\n    \n    Buyer->>UI: Click \"Create & Fund Escrow\"\n    alt ERC-20 Token Escrow\n        UI->>SC: approve(escrowContract, amount)\n        SC-->>UI: Approval Confirmed\n    end\n    UI->>SC: createEscrow(seller, arbitrator, token, amount, milestones[], CID)\n    SC->>SC: Transfer tokens into contract lock\n    SC-->>Node: Emit EscrowCreated(escrowId, buyer, seller, amount, CID)\n    \n    Node->>Node: Verify confirmation depth (12 blocks)\n    Node->>IPFS: Fetch & validate CID contents\n    Node->>DB: Insert Escrow + Milestones record\n    Node-->>UI: WebSocket broadcast (Escrow Active)\n```\n\n### 5.2 Milestone Approval & Fund Release\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Seller\n    actor Buyer\n    participant UI as Next.js Frontend\n    participant IPFS as IPFS Gateway\n    participant SC as BlockEscrow.sol\n    participant Node as Indexer Service\n\n    Seller->>UI: Submit Milestone Deliverable (Code/Files)\n    UI->>IPFS: Pin Deliverable Proof\n    IPFS-->>UI: Return deliverable CID\n    Seller->>SC: submitMilestone(escrowId, milestoneId, CID)\n    SC-->>Node: Emit MilestoneSubmitted(escrowId, milestoneId, CID)\n    \n    Buyer->>UI: Inspect deliverable on UI\n    Buyer->>SC: approveMilestone(escrowId, milestoneId)\n    SC->>SC: Calculate protocol fee (e.g. 0.5%)\n    SC->>SC: SafeTransfer (amount - fee) to Seller\n    SC->>SC: SafeTransfer fee to Protocol Treasury\n    SC-->>Node: Emit MilestoneReleased(escrowId, milestoneId, amountPaid)\n    Node->>Node: Update DB Milestone & Escrow remaining balance\n```\n\n### 5.3 Dispute Raising & Arbitration Resolution\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Buyer\n    actor Arbitrator\n    participant SC as BlockEscrow.sol\n    participant Node as Indexer Service\n    actor Seller\n\n    Buyer->>SC: raiseDispute(escrowId, reasonCID)\n    SC->>SC: Set EscrowStatus = DISPUTED (Locks remaining funds)\n    SC-->>Node: Emit DisputeRaised(escrowId, initiator, reasonCID)\n    \n    Arbitrator->>SC: resolveDispute(escrowId, buyerAward, sellerAward, rulingCID)\n    Note over SC: Require buyerAward + sellerAward == remainingBalance\n    SC->>SC: SafeTransfer buyerAward -> Buyer\n    SC->>SC: SafeTransfer sellerAward -> Seller\n    SC->>SC: Set EscrowStatus = RESOLVED\n    SC-->>Node: Emit DisputeResolved(escrowId, buyerAward, sellerAward)\n    Node->>Node: Update DB status & notify parties via email/push\n```\n\n---\n\n## 6. Frontend Web3 Architecture\n\n```\nsrc/\n├── app/                      # Next.js 14 App Router\n│   ├── (auth)/login/         # SIWE Wallet login\n│   ├── dashboard/            # Overview of active/past escrows\n│   ├── escrow/\n│   │   ├── create/           # Multi-step escrow wizard\n│   │   └── [id]/             # Escrow detail, milestones, & dispute room\n│   ├── arbitrator/           # Arbitrator dashboard & case review\n│   └── api/                  # BFF (Backend-for-Frontend) Proxy routes\n├── components/\n│   ├── escrow/               # MilestoneStepper, DisputeModal, DepositButton\n│   ├── web3/                 # WalletConnectModal, NetworkSwitchBanner\n│   └── ui/                   # shadcn/ui custom primitives\n├── hooks/\n│   ├── useBlockEscrow.ts     # Viem contract write hooks\n│   ├── useEscrowDetails.ts   # TanStack Query + WebSocket sync\n│   └── useSIWE.ts            # Sign-In with Ethereum authentication\n└── lib/\n    ├── contracts/            # ABIs and Typechain/Wagmi generated types\n    ├── ipfs.ts               # Pinata client & gateway fallback fetcher\n    └── wagmi.ts              # Chain configs (Polygon, Arbitrum, Sepolia)\n```\n","theme.md":"# BlockEscrow – Design System & Theme Specification (`theme.md`)\n\n> **Document Version:** 1.0.0  \n> **Target Framework:** Next.js 14+ (App Router), Tailwind CSS v3.4+, Radix UI / shadcn/ui, Lucide Icons  \n> **Design Philosophy:** Institutional Web3 Financial Security, Clarity, High-Trust Visual Feedback, and Accessibility.\n\n---\n\n## 1. Visual Identity & Brand Philosophy\n\nBlockEscrow facilitates high-value, trustless financial agreements. The user interface must project **unquestioned stability, crystal-clear state communication, and zero ambiguity regarding financial transactions**.\n\n### Core Tenets\n1. **Financial Confidence:** Color is reserved for state changes and financial status. Backgrounds and surfaces remain restrained.\n2. **Defensive UX:** Irreversible actions (fund lock, release, dispute escalation) have distinct warning treatments and confirmation gates.\n3. **Optimistic Yet Truthful:** Immediate local state feedback paired with real-time on-chain confirmation counters.\n4. **Data Density with Hierarchy:** Important contract addresses, balances, and deadlines are legible and easily verifiable.\n\n---\n\n## 2. Color Palette & Semantic Tokens\n\nBlockEscrow utilizes an **Electric Slate / Cyber Blue / Mint Emerald** palette. Dark mode is the primary target for professional crypto operators, with a fully contrast-compliant Light Mode for institutional audits.\n\n### 2.1 Base Color Spectrum\n\n| Token Name | Hex Code | HSL Value | Description / Usage |\n| :--- | :--- | :--- | :--- |\n| `slate-950` | `#080B11` | `hsl(222, 47%, 5%)` | Primary Application Canvas (Dark Mode) |\n| `slate-900` | `#0D131F` | `hsl(220, 41%, 9%)` | Card / Surface Background |\n| `slate-800` | `#1A2333` | `hsl(217, 33%, 15%)` | Elevated Borders & Interactive Card Hover |\n| `slate-700` | `#2D3A4F` | `hsl(218, 27%, 24%)` | Divider Lines & Input Field Borders |\n| `slate-400` | `#8B9BB4` | `hsl(218, 23%, 63%)` | Secondary / Metadata Typography |\n| `slate-100` | `#F1F5F9` | `hsl(210, 40%, 96%)` | Primary Header Typography (Dark Mode) |\n| `brand-500` | `#2563EB` | `hsl(221, 83%, 53%)` | Primary Interactive Action (Buttons, Toggles) |\n| `brand-400` | `#38BDF8` | `hsl(199, 89%, 60%)` | Accent Highlights, Active Stepper Indicators |\n\n---\n\n### 2.2 Semantic Escrow State Colors\n\nEscrows transition through strict smart contract states. Each state is paired with a distinct semantic token and pulsing visual indicator:\n\n```\n[DRAFT] ──────► [LOCKED/ACTIVE] ──────► [DISPUTED] ──────► [RESOLVED]\n                      │\n                      ▼\n                 [COMPLETED]\n```\n\n| Escrow State | Background Token | Foreground Token | Border Token | UI Meaning |\n| :--- | :--- | :--- | :--- | :--- |\n| **`DRAFT`** | `bg-amber-500/10` | `text-amber-400` | `border-amber-500/30` | Agreement created off-chain; funds not deposited. |\n| **`LOCKED` / `FUNDED`** | `bg-blue-500/10` | `text-blue-400` | `border-blue-500/30` | Tokens locked inside BlockEscrow smart contract. |\n| **`IN_PROGRESS`** | `bg-indigo-500/10` | `text-indigo-400` | `border-indigo-500/30` | Seller has commenced milestones; deliverables submitted. |\n| **`COMPLETED`** | `bg-emerald-500/10` | `text-emerald-400` | `border-emerald-500/30` | Funds 100% released to seller. Contract finalized. |\n| **`DISPUTED`** | `bg-rose-500/10` | `text-rose-400` | `border-rose-500/30` | Escrow locked; awaiting arbitrator ruling. |\n| **`RESOLVED`** | `bg-purple-500/10` | `text-purple-400` | `border-purple-500/30` | Arbitrator issued split or complete resolution. |\n| **`REFUNDED`** | `bg-zinc-500/10` | `text-zinc-300` | `border-zinc-500/30` | Funds returned to buyer. |\n\n---\n\n## 3. Typography & Hierarchy\n\nBlockEscrow enforces strict dual-font typography: **Inter** for human-readable copy and **JetBrains Mono** for cryptographically verifiable data (hashes, addresses, balances).\n\n```\nInter (UI Copy)            JetBrains Mono (On-Chain Data)\n├── Headers (SemiBold 600) ├── Tx Hashes: 0x8a9...c4b2\n├── Body (Regular 400)     ├── Wallet Addresses: 0x4f3...901e\n└── Tooltips (Medium 500)  └── Balances: 14,500.00 USDC\n```\n\n### 3.1 Type Scale\n\n| Scale | Size | Line Height | Weight | Tailwind Class | Usage |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **Display 1** | 36px (2.25rem) | 2.5rem | 700 Bold | `text-4xl font-bold tracking-tight` | Landing Page Hero, Main Dashboard Balance |\n| **Heading 1** | 28px (1.75rem) | 2rem | 600 SemiBold | `text-2xl font-semibold` | Escrow Detail View, Dispute Room |\n| **Heading 2** | 20px (1.25rem) | 1.75rem | 600 SemiBold | `text-xl font-semibold` | Card Titles, Milestone Section Headers |\n| **Subheading**| 16px (1.0rem)  | 1.5rem | 500 Medium | `text-base font-medium` | Form Field Labels, Table Headers |\n| **Body Text** | 14px (0.875rem)| 1.25rem | 400 Regular| `text-sm font-normal text-slate-300`| Description text, agreement clauses |\n| **Code/Hash** | 13px (0.812rem)| 1.2rem | 500 Medium | `font-mono text-xs text-slate-400`  | Addresses, Tx Hashes, Gas Estimates |\n\n---\n\n## 4. Key Component Design Standards\n\n### 4.1 Wallet Connect & Account Button\n- **Disconnected:** Prominent `brand-500` button with a pulsing plug icon and text `\"Connect Wallet\"`.\n- **Connecting:** Disabled state with an animated circular SVG spinner and text `\"Confirm in Wallet...\"`.\n- **Connected:** Pill component displaying:\n  1. Network Badge (e.g. Green dot + `Polygon Mainnet`).\n  2. Native Token Balance (e.g. `2.415 MATIC`).\n  3. Truncated Address with avatar generated from checksummed address (`0x3A21...b84F`).\n  4. Dropdown indicator for profile, copy address, explorer link, disconnect.\n\n### 4.2 Milestone Stepper Widget\nDisplays chronological progress of multi-party deliverables:\n\n```\n[● Milestone 1: Design Specs] ───► [● Milestone 2: Smart Contract] ───► [○ Milestone 3: Audit]\n     Status: RELEASED                   Status: IN_REVIEW                    Status: LOCKED\n     Amount: 2,500 USDC                 Amount: 5,000 USDC                   Amount: 2,500 USDC\n```\n\n- **Completed:** Emerald checkmark icon, green connecting line, unlocked unlock icon.\n- **Active / Pending Approval:** Amber pulsing border, action button `\"Review & Release Funds\"`.\n- **Locked:** Slate muted icon, locked padlock, non-clickable.\n- **Disputed:** Rose alert triangle, `\"Dispute Filed\"` badge with link to arbitration court.\n\n### 4.3 Transaction Status Toast System\nWeb3 transactions undergo 4 discrete stages:\n1. **Signature Requested:** Blue toast `\"Awaiting user signature in MetaMask...\"`.\n2. **Submitted / Pending:** Yellow toast with spinner: `\"Transaction broadcasted. Tx: 0x93f...3b1 [View on Polygonscan]\"`. Confirmations counter: `(2/12 confirmations)`.\n3. **Confirmed:** Green toast with celebration badge: `\"Escrow #1042 successfully funded on-chain!\"`.\n4. **Reverted / Failed:** Red toast with decoded revert reason (e.g., `Error: BlockEscrow__InsufficientAllowance()`).\n\n---\n\n## 5. CSS & Tailwind Production Configuration\n\n### 5.1 `tailwind.config.ts`\n```typescript\nimport type { Config } from \"tailwindcss\";\n\nconst config: Config = {\n  darkMode: [\"class\"],\n  content: [\n    \"./pages/**/*.{ts,tsx}\",\n    \"./components/**/*.{ts,tsx}\",\n    \"./app/**/*.{ts,tsx}\",\n    \"./src/**/*.{ts,tsx}\",\n  ],\n  theme: {\n    container: {\n      center: true,\n      padding: \"2rem\",\n      screens: {\n        \"2xl\": \"1400px\",\n      },\n    },\n    extend: {\n      colors: {\n        border: \"hsl(var(--border))\",\n        input: \"hsl(var(--input))\",\n        ring: \"hsl(var(--ring))\",\n        background: \"hsl(var(--background))\",\n        foreground: \"hsl(var(--foreground))\",\n        primary: {\n          DEFAULT: \"hsl(var(--primary))\",\n          foreground: \"hsl(var(--primary-foreground))\",\n        },\n        secondary: {\n          DEFAULT: \"hsl(var(--secondary))\",\n          foreground: \"hsl(var(--secondary-foreground))\",\n        },\n        destructive: {\n          DEFAULT: \"hsl(var(--destructive))\",\n          foreground: \"hsl(var(--destructive-foreground))\",\n        },\n        muted: {\n          DEFAULT: \"hsl(var(--muted))\",\n          foreground: \"hsl(var(--muted-foreground))\",\n        },\n        accent: {\n          DEFAULT: \"hsl(var(--accent))\",\n          foreground: \"hsl(var(--accent-foreground))\",\n        },\n        popover: {\n          DEFAULT: \"hsl(var(--popover))\",\n          foreground: \"hsl(var(--popover-foreground))\",\n        },\n        card: {\n          DEFAULT: \"hsl(var(--card))\",\n          foreground: \"hsl(var(--card-foreground))\",\n        },\n        escrow: {\n          draft: \"#F59E0B\",\n          locked: \"#3B82F6\",\n          active: \"#6366F1\",\n          completed: \"#10B981\",\n          disputed: \"#F43F5E\",\n          resolved: \"#A855F7\",\n          refunded: \"#71717A\",\n        },\n      },\n      borderRadius: {\n        lg: \"var(--radius)\",\n        md: \"calc(var(--radius) - 2px)\",\n        sm: \"calc(var(--radius) - 4px)\",\n      },\n      fontFamily: {\n        sans: [\"var(--font-inter)\", \"sans-serif\"],\n        mono: [\"var(--font-jetbrains-mono)\", \"monospace\"],\n      },\n      keyframes: {\n        \"pulse-subtle\": {\n          \"0%, 100%\": { opacity: \"1\" },\n          \"50%\": { opacity: \"0.6\" },\n        },\n        \"glow-border\": {\n          \"0%, 100%\": { borderColor: \"rgba(59, 130, 246, 0.4)\" },\n          \"50%\": { borderColor: \"rgba(59, 130, 246, 0.8)\" },\n        },\n      },\n      animation: {\n        \"pulse-subtle\": \"pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite\",\n        \"glow-border\": \"glow-border 2s ease-in-out infinite\",\n      },\n    },\n  },\n  plugins: [require(\"tailwindcss-animate\")],\n};\n\nexport default config;\n```\n\n### 5.2 `globals.css` Tokens\n```css\n@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n@layer base {\n  :root {\n    --background: 220 33% 98%;\n    --foreground: 222 47% 11%;\n    --card: 0 0% 100%;\n    --card-foreground: 222 47% 11%;\n    --popover: 0 0% 100%;\n    --popover-foreground: 222 47% 11%;\n    --primary: 221 83% 53%;\n    --primary-foreground: 210 40% 98%;\n    --secondary: 210 40% 96.1%;\n    --secondary-foreground: 222 47% 11.2%;\n    --muted: 210 40% 96.1%;\n    --muted-foreground: 215.4 16.3% 46.9%;\n    --accent: 210 40% 96.1%;\n    --accent-foreground: 222 47% 11.2%;\n    --destructive: 0 84.2% 60.2%;\n    --destructive-foreground: 210 40% 98%;\n    --border: 214.3 31.8% 91.4%;\n    --input: 214.3 31.8% 91.4%;\n    --ring: 221 83% 53%;\n    --radius: 0.75rem;\n  }\n\n  .dark {\n    --background: 222 47% 5%;\n    --foreground: 210 40% 98%;\n    --card: 220 41% 9%;\n    --card-foreground: 210 40% 98%;\n    --popover: 220 41% 9%;\n    --popover-foreground: 210 40% 98%;\n    --primary: 217 91% 60%;\n    --primary-foreground: 222 47% 5%;\n    --secondary: 217 33% 15%;\n    --secondary-foreground: 210 40% 98%;\n    --muted: 217 33% 15%;\n    --muted-foreground: 218 23% 63%;\n    --accent: 217 33% 18%;\n    --accent-foreground: 210 40% 98%;\n    --destructive: 347 77% 50%;\n    --destructive-foreground: 210 40% 98%;\n    --border: 218 27% 18%;\n    --input: 218 27% 18%;\n    --ring: 217 91% 60%;\n  }\n}\n```\n","prod.md":"# BlockEscrow – Production Readiness & Infrastructure Specification (`prod.md`)\n\n> **Document Version:** 1.0.0  \n> **Target Status:** Production Ready  \n> **Compliance & Standards:** EVM Security Standards, SOC-2 Type II controls, OpenZeppelin Defender, GDPR (for off-chain PII)\n\n---\n\n## 1. Production Deployment Topology\n\nThe BlockEscrow platform uses a decoupled, highly available, multi-AZ deployment on AWS with multi-chain smart contracts.\n\n```\n                            [ Cloudflare WAF / CDN ]\n                                       │\n                    ┌──────────────────┴──────────────────┐\n                    ▼                                     ▼\n         [ Next.js Edge UI ]                     [ AWS ALB Load Balancer ]\n        (Vercel / CloudFront)                             │\n                                                ┌─────────┴─────────┐\n                                                ▼                   ▼\n                                         [ ECS Fargate ]     [ ECS Fargate ]\n                                          API Task (AZ-1)     API Task (AZ-2)\n                                                │                   │\n                                                └─────────┬─────────┘\n                                                          │\n                    ┌─────────────────────────────────────┼─────────────────────────────────────┐\n                    ▼                                     ▼                                     ▼\n          [ AWS Aurora Postgres ]               [ AWS ElastiCache ]                   [ Infura / Pinata ]\n           (Multi-AZ + Read Rep)                 (Redis Cluster v7)                     (IPFS Cluster)\n                    │\n                    ▼\n          [ Event Indexer Pod ] ◄──────► [ RPC Providers: Alchemy / Infura / QuickNode ]\n```\n\n---\n\n## 2. Environment Variables & Secret Management\n\nAll secrets in production are stored in **AWS Secrets Manager** and injected into containers at runtime. Zero secrets are committed to git repositories.\n\n### 2.1 Smart Contract Deployment (`contracts/.env.production`)\n```bash\n# Network RPCs\nPOLYGON_MAINNET_RPC_URL=\"https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}\"\nARBITRUM_ONE_RPC_URL=\"https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}\"\nETHEREUM_MAINNET_RPC_URL=\"https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}\"\n\n# Deployer / Multi-Sig Safe\nDEPLOYER_PRIVATE_KEY=\"0x...\" # Used only via secure CI KMS runner\nGNOSIS_SAFE_TREASURY_ADDRESS=\"0x9A3B...4C12\"\nGNOSIS_SAFE_ADMIN_ADDRESS=\"0x1D2E...8F90\"\n\n# Contract Verification\nPOLYGONSCAN_API_KEY=\"AIZ...\"\nARBISCAN_API_KEY=\"AIZ...\"\nETHERSCAN_API_KEY=\"AIZ...\"\n\n# Protocol Parameters\nPROTOCOL_FEE_BPS=50 # 0.50%\nMAX_DISPUTE_WINDOW_SECONDS=604800 # 7 days\n```\n\n### 2.2 Backend Indexer & API Service (`backend/.env.production`)\n```bash\nNODE_ENV=\"production\"\nPORT=8080\nAPI_BASE_URL=\"https://api.blockescrow.io\"\n\n# Relational Database (Aurora PostgreSQL Multi-AZ with PgBouncer)\nDATABASE_URL=\"postgresql://escrow_admin:${DB_PASS}@aurora-cluster.prod.internal:5432/blockescrow_prod?connection_limit=50&pool_timeout=20\"\n\n# Redis Cluster (Caching, Session, BullMQ)\nREDIS_HOST=\"redis-cluster.prod.internal\"\nREDIS_PORT=6379\nREDIS_PASSWORD=\"${REDIS_AUTH_TOKEN}\"\nREDIS_TLS=\"true\"\n\n# Multi-RPC Provider Failover Matrix (Comma-Separated)\nPOLYGON_WS_RPCS=\"wss://polygon-mainnet.g.alchemy.com/v2/${KEY1},wss://polygon-rpc.com\"\nPOLYGON_HTTP_RPCS=\"https://polygon-mainnet.g.alchemy.com/v2/${KEY1},https://rpc.ankr.com/polygon\"\n\n# IPFS Pinning Credentials\nPINATA_API_KEY=\"${PINATA_KEY}\"\nPINATA_SECRET_API_KEY=\"${PINATA_SECRET}\"\nPINATA_DEDICATED_GATEWAY=\"https://gateway.blockescrow.io\"\n\n# Authentication (Sign-In with Ethereum - SIWE)\nJWT_SECRET=\"${JWT_STRONG_SECRET}\"\nSESSION_EXPIRATION_HOURS=24\n\n# Monitoring & Alerting\nSENTRY_DSN=\"https://key@o0.ingest.sentry.io/project\"\nSLACK_ALERT_WEBHOOK_URL=\"https://hooks.slack.com/services/T00/B00/X00\"\n```\n\n### 2.3 Frontend Web3 Client (`frontend/.env.production`)\n```bash\nNEXT_PUBLIC_APP_ENV=\"production\"\nNEXT_PUBLIC_API_URL=\"https://api.blockescrow.io\"\nNEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=\"b5e...\"\nNEXT_PUBLIC_DEFAULT_CHAIN_ID=137 # Polygon PoS\n\n# Verified Deployed Contract Addresses\nNEXT_PUBLIC_BLOCK_ESCROW_CONTRACT_POLYGON=\"0x49A3...F940\"\nNEXT_PUBLIC_BLOCK_ESCROW_CONTRACT_ARBITRUM=\"0x72B1...1E35\"\nNEXT_PUBLIC_USDC_CONTRACT_POLYGON=\"0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359\"\n\n# IPFS Gateways\nNEXT_PUBLIC_IPFS_GATEWAY=\"https://gateway.blockescrow.io/ipfs/\"\nNEXT_PUBLIC_IPFS_FALLBACK_GATEWAY=\"https://cloudflare-ipfs.com/ipfs/\"\n```\n\n---\n\n## 3. High-Availability RPC & WebSocket Failover\n\nSingle RPC endpoints are vulnerable to rate limits and outages. BlockEscrow employs a **weighted fallback round-robin pool**:\n\n```typescript\nimport { FallbackProvider, WebSocketProvider, JsonRpcProvider } from \"ethers\";\n\nexport function getResilientProvider(chainId: number): FallbackProvider {\n  const providers = [\n    {\n      provider: new JsonRpcProvider(process.env.ALCHEMY_RPC_URL),\n      priority: 1,\n      stallTimeout: 750,\n      weight: 2,\n    },\n    {\n      provider: new JsonRpcProvider(process.env.INFURA_RPC_URL),\n      priority: 2,\n      stallTimeout: 1000,\n      weight: 1,\n    },\n    {\n      provider: new JsonRpcProvider(process.env.QUICKNODE_RPC_URL),\n      priority: 3,\n      stallTimeout: 1500,\n      weight: 1,\n    },\n  ];\n\n  return new FallbackProvider(providers, 2); // Quorum of 2 for dispute and fund state\n}\n```\n\n---\n\n## 4. Security Hardening & Audit Checklist\n\n### 4.1 Smart Contract Defense\n- [x] **Formal Audit:** Audit conducted by tier-1 security firms (e.g., Trail of Bits, OpenZeppelin, or Spearbit).\n- [x] **Static Analysis:** CI automated runs with `slither .` and `mythril analyze contracts/BlockEscrow.sol`.\n- [x] **Invariant Testing:** Foundry/Echidna invariants asserting zero token lock-in or drainage.\n- [x] **Timelock Controller:** Upgrades and fee changes require a 48-hour timelock governed by a 3-of-5 Gnosis Safe.\n- [x] **Pause Guardians:** Authorized multisig can trigger `pause()` instantly in case of an anomaly, stopping deposits.\n\n### 4.2 Backend & Infrastructure Defense\n- [x] **Rate Limiting:** Cloudflare DDoS mitigation + Redis Sliding-Window rate limiter (100 req/min for public APIs, 20 req/min for auth routes).\n- [x] **SQL Injection Mitigation:** Prisma ORM parameterized queries; raw SQL is prohibited.\n- [x] **Signature Replay Protection:** EIP-4361 SIWE nonce validation with 5-minute expiry and single-use invalidation in Redis.\n- [x] **CORS & CSP:** Strict Content Security Policy preventing unauthorized script injections.\n\n---\n\n## 5. CI/CD Deployment Pipeline\n\n```mermaid\nflowchart LR\n    commit[Git Push / Tag] --> lint[Lint & Static Analysis]\n    lint --> contract_test[Foundry Invariant & Gas Tests]\n    lint --> api_test[Jest Integration Tests + DB]\n    contract_test --> build_img[Docker Build & ECR Push]\n    api_test --> build_img\n    build_img --> db_mig[Run Prisma Migrations]\n    db_mig --> deploy_ecs[Rolling ECS Update]\n    deploy_ecs --> smoke[Post-Deploy Smoke Tests]\n```\n\n### GitHub Actions Workflow Sample (`.github/workflows/deploy.yml`)\n```yaml\nname: Production Deployment Pipeline\n\non:\n  push:\n    tags:\n      - 'v*.*.*'\n\njobs:\n  smart-contracts-audit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Install Foundry\n        uses: foundry-rs/foundry-toolchain@v1\n      - name: Run Foundry Tests & Invariants\n        run: forge test --gas-report\n      - name: Run Slither Security Analyzer\n        uses: crytic/slither-action@v0.3.0\n        with:\n          fail-on: high\n\n  backend-deploy:\n    needs: smart-contracts-audit\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Configure AWS Credentials\n        uses: aws-actions/configure-aws-credentials@v4\n        with:\n          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}\n          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}\n          aws-region: us-east-1\n      - name: Login to Amazon ECR\n        id: login-ecr\n        uses: aws-actions/amazon-ecr-login@v2\n      - name: Build, Tag, and Push Backend Image\n        env:\n          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}\n          IMAGE_TAG: ${{ github.ref_name }}\n        run: |\n          docker build -t $ECR_REGISTRY/blockescrow-backend:$IMAGE_TAG ./backend\n          docker push $ECR_REGISTRY/blockescrow-backend:$IMAGE_TAG\n      - name: Deploy to Amazon ECS (Fargate)\n        run: |\n          aws ecs update-service --cluster blockescrow-prod-cluster \\\n            --service api-indexer-service --force-new-deployment\n```\n\n---\n\n## 6. Observability, Real-Time Monitoring & Alerts\n\n### 6.1 Telemetry Metrics Matrix\n| Metric Name | Source | Alert Threshold | Action |\n| :--- | :--- | :--- | :--- |\n| **`indexer_block_lag`** | Backend Event Listener | `> 5 blocks` behind canonical | Trigger PagerDuty; switch RPC provider |\n| **`reorg_detected_count`** | Reorg Engine | `> 2` within 10 minutes | Alert Slack; temporarily pause settlement indexing |\n| **`failed_dispute_resolutions`** | Smart Contract Event | `> 0` transactions reverted | Immediate high-priority investigation |\n| **`api_5xx_rate`** | Node.js Express/Fastify | `> 1.0%` over 5 mins | Auto-scale ECS tasks + Sentry alert |\n| **`db_connection_utilization`**| RDS CloudWatch | `> 80%` pool capacity | Increase PgBouncer max client connections |\n\n### 6.2 On-Chain Sentinel Monitoring\n- **OpenZeppelin Defender / Tenderly Alerting:**\n  - Emits real-time Discord/Slack alerts whenever `EscrowDisputed` or `EmergencyPaused` events are detected.\n  - Monitors high-value transactions ($>\\$50,000\\text{ USD}$) with an immediate notification to risk auditors.\n\n---\n\n## 7. Disaster Recovery & Emergency Operations Playbook\n\n### Scenario A: Smart Contract Critical Vulnerability Detected\n1. **Emergency Pause:** Admin Multi-Sig executes `BlockEscrow.pause()`. All new escrow creations and deposits are halted.\n2. **Analysis:** Run transaction simulations via Tenderly to identify attack vectors.\n3. **Upgrade Deployment:** Deploy patched implementation contract through the UUPS proxy after multi-sig sign-off and 48-hour timelock review (or immediate execution if zero-day bypass guardian configured).\n\n### Scenario B: Database Corruption or Indexer Desynchronization\n1. Pause the consumer workers in BullMQ (`await indexerQueue.pause()`).\n2. Restore Aurora PostgreSQL from the nearest automated Point-In-Time Recovery snapshot (RPO: $< 5\\text{ minutes}$).\n3. Query `SELECT MAX(blockNumber) FROM Escrow;` to locate the verified database checkpoint.\n4. Run `npm run indexer:resync -- --from-block=<CHECKPOINT_BLOCK>` to sequentially backfill and replay events up to current chain head.\n5. Resume queues.\n","tasks.md":"# BlockEscrow – Production Implementation Tasks & Roadmap (`tasks.md`)\n\n> **Document Version:** 1.0.0  \n> **Methodology:** Agile / 2-Week Sprints  \n> **Total Estimated Effort:** 138 Story Points (approx. 6 Sprints / 12 Weeks)\n\n---\n\n## Sprint & Phase Overview\n\n| Phase | Domain | Focus Area | Story Points | Target Sprints |\n| :--- | :--- | :--- | :--- | :--- |\n| **Phase 1** | Smart Contracts | Core Escrow, Milestones, Security & Upgrades | 34 pts | Sprint 1 – 2 |\n| **Phase 2** | IPFS & Storage | Metadata Schemas, Pinned Deliverables & Gateway | 13 pts | Sprint 2 |\n| **Phase 3** | Backend & Indexer | Event Listener, Reorg Engine, Prisma DB, APIs | 34 pts | Sprint 2 – 4 |\n| **Phase 4** | Frontend Web3 | Next.js 14, Viem/Wagmi, Dashboard, Dispute Room | 34 pts | Sprint 3 – 5 |\n| **Phase 5** | Security & Testing | Foundry Invariants, Synpress E2E, Slither Audits | 13 pts | Sprint 5 – 6 |\n| **Phase 6** | DevOps & Launch | Multi-AZ Cloud, Monitoring, Mainnet Deployment | 10 pts | Sprint 6 |\n\n---\n\n## Phase 1: Smart Contract Protocol Engineering [COMPLETED - 34/34 pts]\n\n### `SC-101`: Project Scaffolding & OpenZeppelin Upgrades Setup `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 3\n- **Status:** Done. Hardhat 2 + OpenZeppelin Contracts v5 initialized, UUPS proxy setup configured.\n- **Verification:** `npx hardhat compile` succeeds with 0 warnings.\n\n### `SC-102`: Core Escrow Storage & State Machine `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 5\n- **Dependencies:** `SC-101`\n- **Status:** Done. `EscrowStorage.sol`, `IEscrowErrors.sol`, `IEscrowEvents.sol`, and `IBlockEscrow.sol` implemented.\n- **Verification:** 8 state enum transitions and custom errors verified in tests.\n\n### `SC-103`: Multi-Party Escrow Creation & Funding Logic `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 5\n- **Dependencies:** `SC-102`\n- **Status:** Done. Supports both Native currency (ETH/MATIC) and ERC-20 (`SafeERC20`). Supports atomic `createAndFundEscrow` and two-step `createEscrow` + `fundEscrow`.\n- **Verification:** Tested against ERC-20 MockUSDC (6 decimals) and Native ETH.\n\n### `SC-104`: Milestone Submission & Approval Release Engine `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 5\n- **Dependencies:** `SC-103`\n- **Status:** Done. `submitMilestone` and `approveMilestone` with partial fund releases and final completion check.\n- **Verification:** Tests verify seller submission, buyer approval, and progression to `COMPLETED`.\n\n### `SC-105`: Protocol Fee Calculation & Treasury Transfer `[COMPLETED]`\n- **Priority:** `P1` | **Points:** 3\n- **Dependencies:** `SC-104`\n- **Status:** Done. Basis-point calculations (`netAmount = amount - fee`) directed to configurable treasury address with 500 bps (5%) hard cap.\n- **Verification:** Verified exact fee arithmetic down to 6-decimal units.\n\n### `SC-106`: Dispute Raising & Arbitrator Resolution Engine `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 8\n- **Dependencies:** `SC-104`\n- **Status:** Done. Buyer/seller dispute triggering with `DISPUTED` state lock; arbitrator-enforced split resolution with sum invariance checking.\n- **Verification:** Tested unauthorized access, sum mismatch revert, and 60/40 award distribution.\n\n### `SC-107`: Emergency Controls, ReentrancyGuard & Pausable `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 5\n- **Dependencies:** `SC-106`\n- **Status:** Done. `ReentrancyGuardUpgradeable`, `PausableUpgradeable`, and `OwnableUpgradeable` integrated across all state-mutating methods.\n- **Verification:** Verified reentrancy attack intercept with `MaliciousReceiver` catching `BlockEscrow__ReentrantCall`, and `EnforcedPause` testing.\n\n---\n\n## Phase 2: Decentralized Storage & IPFS Metadata [COMPLETED - 13/13 pts]\n\n### `IPFS-201`: Agreement & Deliverable JSON Schema Specification `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 2\n- **Status:** Done. `agreement.schema.json`, `deliverable.schema.json`, and `dispute.schema.json` defined and validated in `packages/ipfs-service`.\n- **Verification:** Unit tests confirm strict validation on addresses, milestone sum consistency, and category types.\n\n### `IPFS-202`: Pinata & Private IPFS Cluster Integration Service `[COMPLETED]`\n- **Priority:** `P1` | **Points:** 5\n- **Dependencies:** `IPFS-201`\n- **Status:** Done. `PinataService` implemented with `pinJSONToIPFS`, `pinFileToIPFS`, exponential backoff retry logic, and deterministic CIDv1 generation.\n- **Verification:** Unit tests confirm JSON & file buffer pinning and error handling.\n\n### `IPFS-203`: Fast-Fetch Gateway Resolver with Client-Side Fallback `[COMPLETED]`\n- **Priority:** `P1` | **Points:** 3\n- **Dependencies:** `IPFS-202`\n- **Status:** Done. `GatewayResolver` implemented with `Promise.any` gateway latency racing (dedicated, Cloudflare, ipfs.io, Pinata) and TTL memory caching.\n- **Verification:** 18 of 18 automated tests passing in `packages/ipfs-service`.\n\n---\n\n## Phase 3: Backend & Blockchain Event Indexing [COMPLETED - 34/34 pts]\n\n### `BE-301`: PostgreSQL & Prisma Database Schema Migration `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 3\n- **Status:** Done. `schema.prisma` defined with models for `User`, `Escrow`, `Milestone`, `Dispute`, `EventCursor`, and `AuditLog`.\n- **Verification:** Comprehensive relations, enum states, foreign keys, and compound unique constraints specified.\n\n### `BE-302`: Real-Time WebSocket Event Indexer Service `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 8\n- **Dependencies:** `BE-301`, `SC-102`\n- **Status:** Done. `EventIndexerService` implemented capturing `EscrowCreated`, `FundsDeposited`, `MilestoneSubmitted`, `MilestoneApproved`, `DisputeRaised`, `DisputeResolved`.\n- **Verification:** Verified in `backend/tests/indexer.test.js` (`TC-BE-01`).\n\n### `BE-303`: Block Reorganization (Reorg) Resilience Engine `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 8\n- **Dependencies:** `BE-302`\n- **Status:** Done. Confirmation depth buffer (12 blocks) and canonical block tree tracking; orphan fork detection with safe rollback.\n- **Verification:** Verified with 3-block reorg simulation test (`TC-BE-03`).\n\n### `BE-304`: Sign-In with Ethereum (SIWE / EIP-4361) Auth API `[COMPLETED]`\n- **Priority:** `P0` | **Points:** 5\n- **Dependencies:** `BE-301`\n- **Status:** Done. `AuthService` implemented with 32-char cryptographically secure nonces, 5-minute expiration, immediate consumption, and JWT tokens.\n- **Verification:** Verified with nonce replay prevention tests (`TC-BE-04`, `TC-BE-05`, `TC-BE-06`).\n\n### `BE-305`: REST & WebSocket APIs for Escrow Management `[COMPLETED]`\n- **Priority:** `P1` | **Points:** 5\n- **Dependencies:** `BE-304`, `BE-302`\n- **Status:** Done. Express endpoints: `GET /api/v1/health`, `GET /api/v1/auth/nonce`, `POST /api/v1/auth/verify`, `GET /api/v1/escrows`, `GET /api/v1/escrows/:id`, `POST /api/v1/escrows/draft`.\n- **Verification:** Verified in `backend/tests/escrow.test.js` (`TC-BE-07`).\n\n### `BE-306`: BullMQ Notification & Email Dispatch Worker `[COMPLETED]`\n- **Priority:** `P2` | **Points:** 5\n- **Dependencies:** `BE-305`\n- **Status:** Done. `QueueService` implemented with async job handlers, exponential backoff retries, and dead-letter queue routing.\n- **Verification:** Verified in `backend/tests/queue.test.js` (`TC-BE-08`).\n\n---\n\n## Phase 4: Frontend Web3 Application [COMPLETED]\n\n### `FE-401`: Next.js 14 App Scaffolding & Wagmi v2 Integration\n- **Priority:** `P0` | **Points:** 3\n- **Status:** Done. Web3 wallet hook (`useWeb3Wallet.js`), network switcher (`NetworkSwitchBanner.js`), and chains configuration (`chains.js`) implemented.\n- **Verification:** Verified in `frontend/tests/web3-hooks.test.js` and `frontend/tests/ui-components.test.js`.\n\n### `FE-402`: SIWE Authentication Hook & Session State\n- **Priority:** `P0` | **Points:** 3\n- **Dependencies:** `FE-401`, `BE-304`\n- **Status:** Done. `SIWEService` implemented with EIP-4361 standard message creation, nonce verification, and session management (`frontend/src/hooks/useSIWE.js`).\n- **Verification:** Verified in `frontend/tests/web3-hooks.test.js`.\n\n### `FE-403`: User Dashboard (Active, Completed, Disputed Escrows)\n- **Priority:** `P1` | **Points:** 5\n- **Dependencies:** `FE-402`, `BE-305`\n- **Status:** Done. `renderDashboardView` implemented with portfolio metrics, role-based filtering (Buyer/Seller/Arbitrator), and responsive grid (`frontend/src/views/DashboardView.js`).\n- **Verification:** Verified in `frontend/tests/e2e-journey.test.js`.\n\n### `FE-404`: Multi-Step Escrow Creation Wizard\n- **Priority:** `P0` | **Points:** 8\n- **Dependencies:** `FE-401`, `IPFS-202`\n- **Status:** Done. `CreateEscrowWizard` 4-step wizard model implemented with rigorous parameter validation, address checking, and milestone sum reconciliation (`frontend/src/views/CreateEscrowWizard.js`).\n- **Verification:** Verified in `frontend/tests/escrow-wizard.test.js`.\n\n### `FE-405`: Escrow Detail & Milestone Management View\n- **Priority:** `P0` | **Points:** 8\n- **Dependencies:** `FE-404`\n- **Status:** Done. `renderMilestoneStepper` and `renderEscrowCard` implemented with responsive progress visualization, status badges, and role-based action CTAs (`frontend/src/components/escrow/MilestoneStepper.js`, `frontend/src/components/escrow/EscrowCard.js`).\n- **Verification:** Verified in `frontend/tests/ui-components.test.js`.\n\n### `FE-406`: Dispute Filing & Arbitration Court Room\n- **Priority:** `P0` | **Points:** 7\n- **Dependencies:** `FE-405`\n- **Status:** Done. `renderArbitrationConsole` and `calculateArbitrationSplit` implemented with strict 10,000 basis points split validation and dispute award calculation (`frontend/src/components/escrow/ArbitrationConsole.js`).\n- **Verification:** Verified in `frontend/tests/ui-components.test.js`.\n\n---\n\n## Phase 5: Security Audits & Quality Assurance\n\n### `QA-501`: Comprehensive Foundry Unit & Fuzz Tests\n- **Priority:** `P0` | **Points:** 5\n- **Dependencies:** `SC-107`\n- **Description:** Write Foundry unit tests and fuzzing campaigns covering all state transitions, boundary values, and zero-value transfers.\n- **Acceptance Criteria:**\n  - Test coverage $>98\\%$ on `BlockEscrow.sol`.\n  - Zero critical/high findings on Slither.\n\n### `QA-502`: Synpress & Playwright Web3 End-to-End Test Suite\n- **Priority:** `P1` | **Points:** 5\n- **Dependencies:** `FE-405`\n- **Description:** Automate full user journey tests with Synpress (simulated MetaMask):\n  - Buyer creates escrow -> Seller submits milestone -> Buyer releases funds.\n- **Acceptance Criteria:**\n  - Runs in CI headlessly on local Anvil fork.\n\n### `QA-503`: Load & Concurrency Testing with k6\n- **Priority:** `P2` | **Points:** 3\n- **Dependencies:** `BE-305`\n- **Description:** Stress-test backend REST APIs and WebSocket connections under 1,000 concurrent users.\n- **Acceptance Criteria:**\n  - $p95$ API latency $< 200\\text{ms}$. Zero unhandled memory leaks.\n\n---\n\n## Phase 6: DevOps, Cloud & Launch [COMPLETED]\n\n### `OPS-601`: Multi-Stage Dockerfile & Local Docker Compose\n- **Priority:** `P0` | **Points:** 3\n- **Status:** Done. Created multi-stage Dockerfiles (`deploy/docker/Dockerfile.backend`, `Dockerfile.worker`, `Dockerfile.frontend`) with unprivileged `nodejs` user, health checks, and root `docker-compose.yml` orchestrating Postgres 16, Redis 7, IPFS Kubo, Backend API, Worker, Frontend, and Prometheus.\n- **Verification:** Verified in `backend/tests/devops-smoke.test.js` (`TC-OPS-01`).\n\n### `OPS-602`: Multi-Chain Smart Contract Deployment & Verification\n- **Priority:** `P0` | **Points:** 4\n- **Dependencies:** `QA-501`\n- **Status:** Done. Multi-chain deployment automation script (`contracts/scripts/deploy-multichain.js`) implemented supporting Polygon PoS, Arbitrum One, and Sepolia with UUPS proxy initialization, multi-sig ownership handover, and deployment manifest generation.\n- **Verification:** Verified in `backend/tests/devops-smoke.test.js` (`TC-OPS-04`).\n\n### `OPS-603`: Production Telemetry, Sentry & Prometheus Setup\n- **Priority:** `P1` | **Points:** 3\n- **Dependencies:** `OPS-601`\n- **Status:** Done. Prometheus registry & metrics exporter (`backend/src/telemetry/prometheus.js`), resilient multi-RPC failover provider (`backend/src/telemetry/resilient-rpc.js`), scrape config (`deploy/prometheus/prometheus.yml`), and alert rules (`deploy/prometheus/rules/indexer-alerts.yml`) configured.\n- **Verification:** Verified in `backend/tests/devops-smoke.test.js` (`TC-OPS-02`, `TC-OPS-03`, `TC-OPS-05`).\n","test.md":"# BlockEscrow – Comprehensive Multi-Phase Testing Specification (`test.md`)\n\n> **Document Version:** 2.0.0  \n> **Status:** Production Test Matrix (Phase 1 & Phase 2 Verified — 34 of 34 Automated Tests Passing)  \n> **Structure:** Detailed Test Cases, Realistic Code Snippets, Inputs, Assertions, and Failure Modes for Every Phase (Phase 1 through Phase 6).\n\n---\n\n## 🗺️ Master Testing Architecture by Phase\n\n```\n┌────────────────────────────────────────────────────────────────────────┐\n│                       BLOCKESCROW TESTING PYRAMID                      │\n└────────────────────────────────────────────────────────────────────────┘\n\n  [Phase 6] DevOps & Cloud    │ Docker Healthchecks, Prometheus Metrics, RPC Failover\n  [Phase 5] Security & Fuzz   │ Foundry Invariants (Solvency), Slither AST, Echidna\n  [Phase 4] Frontend Web3     │ Synpress E2E (MetaMask), Wagmi Hooks, Optimistic UI\n  [Phase 3] Backend & Indexer │ Testcontainers (PG/Redis), 3-Block Reorg Rollback, SIWE\n  [Phase 2] IPFS & Metadata   │ 18 Unit Tests: JSON Schemas, Pinata CIDv1, Gateway Race\n  [Phase 1] Smart Contracts   │ 16 Unit Tests: UUPS Proxy, Milestones, Fees, Disputes\n```\n\n---\n\n## 1. Phase 1: Smart Contract Protocol Engineering\n\nTarget Contract: [`contracts/contracts/BlockEscrow.sol`](file:///Users/nilanjanmondal/blockProjects/contracts/contracts/BlockEscrow.sol)  \nFramework: Hardhat, Ethers.js v6, OpenZeppelin v5  \nTotal Test Cases: **16 Automated Tests** (All Passing)\n\n### Test Cases Matrix (Phase 1)\n\n| Test ID | Test Name | Input / Setup | Expected Outcome | Assertion Example |\n| :--- | :--- | :--- | :--- | :--- |\n| `TC-SC-01` | Proxy Initialization | Deploy UUPS proxy; set owner, treasury, fee = 50 bps | Variables stored correctly in proxy storage | `expect(await escrow.feeBasisPoints()).to.equal(50)` |\n| `TC-SC-02` | Zero Address Rejection | Initialize with `treasury = address(0)` | Transaction reverts with custom error | `revertedWithCustomError(escrow, \"BlockEscrow__ZeroAddress\")` |\n| `TC-SC-03` | Excessive Fee Rejection | Initialize with fee = 501 bps (5.01%) | Reverts with fee cap custom error | `revertedWithCustomError(escrow, \"BlockEscrow__ExcessiveFeeBasisPoints\")` |\n| `TC-SC-04` | Re-initialization Guard | Call `initialize()` on already initialized proxy | OpenZeppelin `InvalidInitialization` error | `revertedWithCustomError(escrow, \"InvalidInitialization\")` |\n| `TC-SC-05` | Fee Governance Access | Attacker calls `setFeeBasisPoints(100)` | Reverts with OpenZeppelin access error | `revertedWithCustomError(escrow, \"OwnableUnauthorizedAccount\")` |\n| `TC-SC-06` | Emergency Pause Trigger | Owner calls `pause()`; user calls `createEscrow()` | Reverts with pause modifier error | `revertedWithCustomError(escrow, \"EnforcedPause\")` |\n| `TC-SC-07` | Milestone Sum Check | M1 = 4000, M2 = 5000, Total = 10000 | Reverts because $4000 + 5000 \\ne 10000$ | `revertedWithCustomError(escrow, \"BlockEscrow__MilestoneSumMismatch\")` |\n| `TC-SC-08` | Identity Separation | Buyer address == Seller address | Reverts to prevent self-dealing | `revertedWithCustomError(escrow, \"BlockEscrow__IdenticalParties\")` |\n| `TC-SC-09` | Two-Step ERC-20 Escrow | Buyer creates escrow (DRAFT), then approves & funds | Status moves from DRAFT (0) to FUNDED (1) | `expect(await escrow.getEscrowStatus(1)).to.equal(1)` |\n| `TC-SC-10` | Atomic Native ETH Escrow | Buyer calls `createAndFundEscrow` with 10 ETH | Contract balance increases by 10 ETH | `expect(await provider.getBalance(escrowAddress)).to.equal(10 ETH)` |\n| `TC-SC-11` | Milestone Submission Role | Seller submits deliverable IPFS hash | Status moves to SUBMITTED; timestamp logged | `expect(milestone.status).to.equal(1)` |\n| `TC-SC-12` | Milestone Approval & Fee | Buyer approves 4000 USDC milestone at 0.5% fee | Seller: +3980 USDC, Treasury: +20 USDC | Net payout and fee math exact match |\n| `TC-SC-13` | Full Contract Completion | Buyer approves final milestone | Escrow status transitions to COMPLETED (3) | `expect(await escrow.getEscrowStatus(1)).to.equal(3)` |\n| `TC-SC-14` | Dispute State Lock | Buyer calls `raiseDispute()`; seller submits work | Milestone actions blocked while DISPUTED | `revertedWithCustomError(escrow, \"BlockEscrow__InvalidEscrowStatus\")` |\n| `TC-SC-15` | Arbitrator Award Split | Arbitrator approves 40% Buyer / 60% Seller split | Enforces $Award_B + Award_S \\equiv Remaining$ | `expect(await escrow.getRemainingBalance(1)).to.equal(0)` |\n| `TC-SC-16` | Reentrancy Defense | Malicious contract calls `refundEscrow()` in `receive()` | Intercepted with `BlockEscrow__ReentrantCall` | `attackSucceeded == false` |\n\n### Concrete Phase 1 Code Examples\n\n#### Example 1.1: Atomic Native ETH Escrow & Milestone Flow (`TC-SC-10` & `TC-SC-12`)\n```javascript\nit(\"should create and fund escrow with native ETH and approve milestone\", async function () {\n  const milestones = [\n    { title: \"Design Phase\", amount: ethers.parseEther(\"4\"), deadline: 10000000000 },\n    { title: \"Smart Contracts\", amount: ethers.parseEther(\"6\"), deadline: 10000000000 }\n  ];\n\n  // Atomic deposit of 10 ETH\n  await escrow.connect(buyer).createAndFundEscrow(\n    seller.address,\n    arbitrator.address,\n    ethers.ZeroAddress, // Native ETH\n    ethers.parseEther(\"10\"),\n    milestones,\n    \"QmAgreementCID\",\n    { value: ethers.parseEther(\"10\") }\n  );\n\n  expect(await ethers.provider.getBalance(await escrow.getAddress())).to.equal(ethers.parseEther(\"10\"));\n\n  // Seller submits deliverable\n  await escrow.connect(seller).submitMilestone(1, 0, \"QmDeliverable1\");\n\n  // Buyer approves milestone 0\n  const sellerInitial = await ethers.provider.getBalance(seller.address);\n  await escrow.connect(buyer).approveMilestone(1, 0);\n\n  // Remaining balance in escrow is now 6 ETH\n  expect(await escrow.getRemainingBalance(1)).to.equal(ethers.parseEther(\"6\"));\n});\n```\n\n#### Example 1.2: Reentrancy Attack Protection (`TC-SC-16`)\n```javascript\nit(\"should intercept reentrancy attacks using upgrade-safe guard\", async function () {\n  // MaliciousReceiver is the seller\n  await maliciousReceiver.setAttackParams(escrowId);\n\n  // Buyer triggers payout; MaliciousReceiver receive() attempts reentrant refundEscrow()\n  await escrow.connect(buyer).approveMilestone(escrowId, 0);\n\n  // Reentrancy attack was completely neutralized\n  expect(await maliciousReceiver.attackSucceeded()).to.be.false;\n\n  const revertData = await maliciousReceiver.attackRevertData();\n  const expectedSelector = ethers.id(\"BlockEscrow__ReentrantCall()\").slice(0, 10);\n  expect(revertData.slice(0, 10)).to.equal(expectedSelector);\n});\n```\n\n---\n\n## 2. Phase 2: Decentralized Storage & IPFS Metadata Layer\n\nTarget Package: [`packages/ipfs-service/`](file:///Users/nilanjanmondal/blockProjects/packages/ipfs-service/)  \nFramework: Node.js `node:test`, Native `fetch`, JSON Schema Draft-07  \nTotal Test Cases: **18 Automated Tests** (All Passing)\n\n### Test Cases Matrix (Phase 2)\n\n| Test ID | Test Name | Input / Setup | Expected Outcome | Assertion Example |\n| :--- | :--- | :--- | :--- | :--- |\n| `TC-IPFS-01` | Address Regex Check | Test valid `0x7099...C8` and invalid string `\"0x123\"` | Returns `true` for 40-char hex, `false` otherwise | `assert.strictEqual(isEthereumAddress(addr), true)` |\n| `TC-IPFS-02` | Valid Agreement Schema | Complete agreement JSON matching `agreement.schema.json` | Schema validator returns `valid = true` | `assert.strictEqual(res.valid, true)` |\n| `TC-IPFS-03` | Milestone Sum Check | M1 = 4000, M2 = 5000, TotalAmount = 10000 | Fails with explicit math mismatch error | `assert.ok(res.errors[0].includes(\"Milestones sum\"))` |\n| `TC-IPFS-04` | Self-Dealing Check | Buyer address == Seller address | Validator detects identity collision | `assert.ok(res.errors[0].includes(\"cannot be identical\"))` |\n| `TC-IPFS-05` | Deliverable Schema | Milestone deliverable JSON with repo URL & git commit | Validates all fields against deliverable schema | `assert.strictEqual(res.valid, true)` |\n| `TC-IPFS-06` | Dispute Category Enum | Category = `\"NON_DELIVERY\"` vs `\"INVALID_REASON\"` | Enum validation permits known; rejects unknown | `assert.ok(res.errors[0].includes(\"Invalid category\"))` |\n| `TC-IPFS-07` | Pinata JSON Pinning | Upload JSON metadata in offline/sandbox mode | Produces canonical CIDv1 (`bafkrei...`) | `assert.ok(res.cid.startsWith(\"bafkrei\"))` |\n| `TC-IPFS-08` | Pinata File Pinning | Buffer = `Buffer.from(\"file contents\")` | Produces CIDv1 and matches byte length | `assert.strictEqual(res.pinSize, buffer.length)` |\n| `TC-IPFS-09` | Malformed JSON Input | Pass `null` or string into `pinJSONToIPFS` | Throws descriptive `Invalid jsonBody` error | `assert.rejects(..., /Invalid jsonBody/)` |\n| `TC-IPFS-10` | Malformed Buffer Input | Pass string instead of Buffer to `pinFileToIPFS` | Throws `Invalid fileBuffer` error | `assert.rejects(..., /Invalid fileBuffer/)` |\n| `TC-IPFS-11` | Gateway Cache Hit | Query already cached CID | Resolves from in-memory cache with 0ms latency | `assert.strictEqual(res.latencyMs, 0)` |\n| `TC-IPFS-12` | Cache Expiration | Query CID whose TTL timestamp has passed | Stale record purged; returns `null` | `assert.strictEqual(cached, null)` |\n| `TC-IPFS-13` | Validate & Pin Flow | Run `validateAndPinAgreement()` | Validates schema + returns CIDv1 + metadata | `assert.ok(pinned.cid.startsWith(\"bafkrei\"))` |\n| `TC-IPFS-14` | Validate Deliverable | Run `validateAndPinDeliverable()` | Validates schema + returns deliverable CIDv1 | `assert.strictEqual(pinned.data.escrowId, 5)` |\n| `TC-IPFS-15` | Dispute Statement Length | Statement $< 20$ characters long | Rejects because statement is too short | `assert.rejects(..., /Dispute validation failed/)` |\n| `TC-IPFS-16` | Protocol URI Clean | Pass `ipfs://bafkrei...` to resolver | Strips `ipfs://` and builds clean HTTP URL | Gateway URL properly constructed |\n| `TC-IPFS-17` | Multi-Gateway Race | Race Cloudflare, Pinata, and ipfs.io | `Promise.any` resolves with fastest provider | Resolves first responding gateway |\n| `TC-IPFS-18` | Security Checksums | Deliverable contains SHA-256 and commit hash | Pattern regex enforces strict security format | Validates 40-char hex commit hashes |\n\n### Concrete Phase 2 Code Examples\n\n#### Example 2.1: Agreement Schema Validation & Pinning (`TC-IPFS-02` & `TC-IPFS-07`)\n```javascript\nconst { validateAndPinAgreement } = require(\"../src/index\");\n\nconst agreementPayload = {\n  version: \"1.0.0\",\n  title: \"Frontend & Backend Integration\",\n  description: \"Next.js UI paired with Node.js event indexer\",\n  buyer: \"0x1111111111111111111111111111111111111111\",\n  seller: \"0x2222222222222222222222222222222222222222\",\n  arbitrator: \"0x3333333333333333333333333333333333333333\",\n  tokenSymbol: \"USDC\",\n  totalAmount: \"5000.00\",\n  milestones: [\n    { index: 0, title: \"API Development\", amount: \"2500.00\", dueDate: \"2026-10-01T00:00:00Z\" },\n    { index: 1, title: \"UI Integration\", amount: \"2500.00\", dueDate: \"2026-10-15T00:00:00Z\" }\n  ]\n};\n\nconst result = await validateAndPinAgreement(agreementPayload);\nassert.ok(result.cid.startsWith(\"bafkrei\"));\nassert.strictEqual(result.data.totalAmount, \"5000.00\");\n```\n\n#### Example 2.2: Multi-Gateway Latency Racing with Cache Acceleration (`TC-IPFS-11` & `TC-IPFS-17`)\n```javascript\nconst { GatewayResolver } = require(\"../src/gateway.resolver\");\nconst resolver = new GatewayResolver();\n\n// Pre-fill cache\nconst sampleCid = \"bafkreia7b25e709a34bc1d8f89104fa28db872410a562719a8\";\nresolver._saveToCache(sampleCid, { agreementTitle: \"Audit Escrow\" });\n\n// Resolves instantly from cache with 0ms latency\nconst resolved = await resolver.fetchJSON(sampleCid);\nassert.strictEqual(resolved.sourceGateway, \"cache\");\nassert.strictEqual(resolved.latencyMs, 0);\nassert.strictEqual(resolved.data.agreementTitle, \"Audit Escrow\");\n```\n\n---\n\n## 3. Phase 3: Backend & Blockchain Event Indexing Specification\n\nTarget Directory: `backend/`  \nFramework: Node.js, Express, Prisma ORM, BullMQ, Redis, Ethers.js WebSocket Provider  \nTesting Target: **8 Integration Test Cases**\n\n### Test Cases Matrix (Phase 3)\n\n| Test ID | Test Name | Scenario Description | Expected Outcome | Verification |\n| :--- | :--- | :--- | :--- | :--- |\n| `TC-BE-01` | Event Ingestion | Smart contract emits `EscrowCreated` | Event indexed into PostgreSQL `Escrow` table | `expect(dbEscrow.onChainEscrowId).toEqual(1)` |\n| `TC-BE-02` | Confirmation Depth | Event arrives at block $H$; depth = 12 blocks | Marked `UNCONFIRMED` until $H + 12$ finalized | Database status moves to `CONFIRMED` |\n| `TC-BE-03` | 3-Block Reorg Rollback | Block hash diverges at height 100 on Polygon | Unfinalized event rows deleted / rolled back | Database rolls back to canonical block hash |\n| `TC-BE-04` | SIWE Nonce Generator | Client requests `/api/v1/auth/nonce` | Generates 32-char cryptographically secure nonce | Nonce stored in Redis with 5-minute TTL |\n| `TC-BE-05` | SIWE EIP-4361 Auth | Client submits signed EIP-4361 message | Validates signature; returns signed JWT | JWT contains user wallet address; HTTP 200 |\n| `TC-BE-06` | Nonce Replay Prevention | Attacker submits same signed SIWE twice | Replay attempt rejected with HTTP 401 | Redis marks nonce as consumed immediately |\n| `TC-BE-07` | Cache Invalidation | Buyer approves milestone on-chain | Redis cache for `/api/v1/escrows/:id` invalidated | Fresh data fetched from PostgreSQL |\n| `TC-BE-08` | BullMQ Job Retries | Email worker fails on transient SMTP timeout | Job retried 3 times with exponential backoff | Successfully delivers on retry 2 |\n\n### Concrete Phase 3 Code Example: Reorg Detection & Rollback (`TC-BE-03`)\n```typescript\n// backend/tests/reorg.test.ts\nimport { PrismaClient } from \"@prisma/client\";\nimport { EventIndexerService } from \"../src/services/indexer.service\";\n\nit(\"should detect chain divergence and roll back unfinalized escrows\", async () => {\n  const indexer = new EventIndexerService();\n\n  // 1. Process block 100 on Fork A\n  await indexer.processBlock({\n    blockNumber: 100n,\n    blockHash: \"0xForkA_Hash\",\n    events: [{ name: \"EscrowCreated\", escrowId: 99 }]\n  });\n\n  expect(await prisma.escrow.findUnique({ where: { onChainEscrowId: 99 } })).toBeDefined();\n\n  // 2. Chain reorg occurs: Canonical block 100 is Fork B\n  await indexer.handleBlockHeader({\n    blockNumber: 100n,\n    blockHash: \"0xForkB_CanonicalHash\",\n    parentHash: \"0xBlock99_Hash\"\n  });\n\n  // 3. Unconfirmed Fork A event has been successfully purged\n  const purgedEscrow = await prisma.escrow.findUnique({ where: { onChainEscrowId: 99 } });\n  expect(purgedEscrow).toBeNull();\n});\n```\n\n---\n\n## 4. Phase 4: Frontend Web3 Application Specification\n\nTarget Directory: `frontend/`  \nFramework: Next.js 14 (App Router), Wagmi v2, Viem, TanStack Query, Synpress (Playwright + MetaMask)  \nTesting Target: **8 E2E Test Cases**\n\n### Test Cases Matrix (Phase 4)\n\n| Test ID | Test Name | Scenario Description | Expected Outcome | Verification |\n| :--- | :--- | :--- | :--- | :--- |\n| `TC-FE-01` | Wallet Connection | User clicks \"Connect Wallet\" on dashboard | MetaMask modal approves; address displayed | `[data-testid='user-address-pill']` visible |\n| `TC-FE-02` | Network Switch | User is connected to Ethereum Mainnet | Banner prompts \"Switch to Polygon PoS\" | Switch network prompt accepted in wallet |\n| `TC-FE-03` | Token Allowance Flow | Escrow Wizard detects zero USDC allowance | Renders \"Approve USDC\" button before deposit | MetaMask approves token spending cap |\n| `TC-FE-04` | Escrow Wizard Stepper | User inputs 3 milestones with dates | Pre-validates milestone sum == deposit amount | \"Next Step\" disabled until amounts balance |\n| `TC-FE-05` | Optimistic Status Update| Buyer clicks \"Approve Milestone\" | UI immediately shows \"Releasing Funds...\" | Replaced with confirmed green check on tx receipt |\n| `TC-FE-06` | Dispute Evidence Modal | User files dispute with statement and files | Uploads evidence to IPFS; submits on-chain tx | Escrow badge updates to `DISPUTED` |\n| `TC-FE-07` | Arbitrator Award Slider | Arbitrator opens ruling panel | Slider enforces Buyer % + Seller % == 100% | Resolving transaction broadcasts to chain |\n| `TC-FE-08` | Transaction Toast Alert | Transaction broadcasted to mempool | Toast displays Polygonscan link and confirmations | Toast updates from pending to confirmed |\n\n### Concrete Phase 4 Code Example: Synpress E2E User Journey (`TC-FE-01` & `TC-FE-03`)\n```typescript\n// frontend/tests/e2e/escrow-creation.spec.ts\nimport { test, expect } from \"../fixtures/synpress\";\n\ntest(\"Full Escrow Creation Journey with MetaMask\", async ({ page, metamask }) => {\n  await page.goto(\"http://localhost:3000\");\n\n  // Step 1: Connect Wallet\n  await page.click(\"button:has-text('Connect Wallet')\");\n  await metamask.acceptAccess();\n  await expect(page.locator(\"[data-testid='user-pill']\")).toContainText(\"0x7099...79C8\");\n\n  // Step 2: Escrow Wizard\n  await page.click(\"a:has-text('Create Escrow')\");\n  await page.fill(\"input[name='title']\", \"Full-Stack Security Audit\");\n  await page.fill(\"input[name='totalAmount']\", \"5000\");\n  await page.fill(\"input[name='sellerAddress']\", \"0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC\");\n\n  // Step 3: Approve & Fund in MetaMask\n  await page.click(\"button:has-text('Review & Fund Escrow')\");\n  await metamask.confirmPermissionToSpend();\n  await metamask.confirmTransaction();\n\n  // Step 4: Verification\n  await expect(page.locator(\".toast-success\")).toContainText(\"Escrow successfully funded on-chain\");\n  await expect(page.locator(\"[data-testid='escrow-badge']\")).toHaveText(\"FUNDED\");\n});\n```\n\n---\n\n## 5. Phase 5: Security Audits, Invariant & Fuzz Testing Specification\n\nFramework: Foundry (`forge test`), Slither, Echidna, Mythril  \nTesting Target: **6 Security Invariants & Static Analysis Tests**\n\n### Test Cases Matrix (Phase 5)\n\n| Test ID | Test Name | Scenario Description | Expected Outcome | Verification |\n| :--- | :--- | :--- | :--- | :--- |\n| `TC-SEC-01` | Invariant: Solvency | Fuzz random deposits, releases, and disputes | Contract Token Balance $\\ge \\sum \\text{Remaining}$ | `assertGe(contractBalance, totalRemaining)` |\n| `TC-SEC-02` | Invariant: No Fund Lock | Run 100,000 fuzzed transactions | Funds can always be claimed or refunded | Zero funds trapped permanently |\n| `TC-SEC-03` | Slither Static Analyzer | Run AST static vulnerability analysis | Zero High / Critical severity warnings | `slither . --fail-on high` exits with 0 |\n| `TC-SEC-04` | Reentrancy Fuzzing | Fuzz external calls with recursive contracts | Reentrancy guard reverts all inner entries | Zero unauthorized state modifications |\n| `TC-SEC-05` | Fee Arithmetic Rounding | Test with 1 wei amounts and odd decimals | Rounding favors protocol or remains lossless | Zero integer underflow / divide-by-zero |\n| `TC-SEC-06` | MEV / Front-Running | Simulate front-running milestone submissions | Order of submission cannot steal recipient payout| Payout locked to original seller address |\n\n### Concrete Phase 5 Code Example: Foundry Invariant Solvency Campaign (`TC-SEC-01`)\n```solidity\n// contracts/test/invariants/BlockEscrowInvariant.t.sol\npragma solidity ^0.8.24;\n\nimport \"forge-std/Test.sol\";\nimport \"../../contracts/BlockEscrow.sol\";\n\ncontract BlockEscrowInvariantTest is Test {\n    BlockEscrow public escrow;\n    MockERC20 public usdc;\n    EscrowHandler public handler;\n\n    function setUp() public {\n        usdc = new MockERC20(\"USDC\", \"USDC\", 6);\n        escrow = new BlockEscrow();\n        escrow.initialize(address(this), address(0x999), 50);\n\n        handler = new EscrowHandler(escrow, usdc);\n        targetContract(address(handler));\n    }\n\n    /// @notice Invariant: The protocol must NEVER be insolvent under any sequence of transactions\n    function invariant_ProtocolSolvencyMaintained() public view {\n        uint256 contractBalance = usdc.balanceOf(address(escrow));\n        uint256 expectedRemaining = handler.ghost_totalRemainingBalances();\n\n        assertGe(\n            contractBalance, \n            expectedRemaining, \n            \"CRITICAL: Contract balance is less than sum of active escrow balances!\"\n        );\n    }\n}\n```\n\n---\n\n## 6. Phase 6: DevOps, Cloud Infrastructure & Smoke Tests\n\nFramework: Docker, AWS ECS Fargate, Prometheus, CloudWatch, Hardhat Ignition  \nTesting Target: **5 Operational Verification Tests**\n\n### Test Cases Matrix (Phase 6)\n\n| Test ID | Test Name | Scenario Description | Expected Outcome | Verification |\n| :--- | :--- | :--- | :--- | :--- |\n| `TC-OPS-01` | Multi-Stage Docker Build | Run `docker build` on backend and indexer | Image size $< 200\\text{MB}$; unprivileged user | Docker healthcheck returns HTTP 200 |\n| `TC-OPS-02` | Indexer Lag Alerting | Simulate WebSocket disconnect for 15 blocks | Prometheus metric `indexer_block_lag > 5` | PagerDuty / Slack alert triggers in 30s |\n| `TC-OPS-03` | RPC Fallback Switching | Inject 500 error into Primary Alchemy RPC | Resilient provider fails over to Infura in $< 1\\text{s}$ | Zero failed user transactions |\n| `TC-OPS-04` | Mainnet Verification | Deploy contract using Hardhat Ignition | Etherscan / Polygonscan automatically verified | ABI and bytecode match on explorer |\n| `TC-OPS-05` | Database Disaster Recovery | Terminate primary Aurora PostgreSQL AZ | Multi-AZ replica promotes to primary in $< 60\\text{s}$ | BullMQ consumer resumes without lost events |\n\n### Concrete Phase 6 Code Example: Prometheus Alert Rule (`TC-OPS-02`)\n```yaml\n# deploy/prometheus/rules/indexer-alerts.yml\ngroups:\n  - name: blockescrow-indexer\n    rules:\n      - alert: IndexerHighBlockLag\n        expr: blockescrow_indexer_canonical_block - blockescrow_indexer_last_indexed_block > 5\n        for: 30s\n        labels:\n          severity: critical\n        annotations:\n          summary: \"BlockEscrow indexer is lagging behind canonical chain\"\n          description: \"Indexer is {{ $value }} blocks behind on Polygon Mainnet. Initiating RPC failover.\"\n```\n\n---\n\n## 🏃 Summary: How to Run Current Automated Tests (Phases 1 & 2)\n\n```bash\n# Run all 34 automated tests across Smart Contracts and IPFS\nnpm test\n\n# Run only Smart Contract tests (Phase 1: 16 tests)\nnpm run test:contracts\n\n# Run only IPFS & Schema tests (Phase 2: 18 tests)\nnpm run test:ipfs\n```\n","README.md":"# BlockEscrow – Documentation Hub\n\nWelcome to the BlockEscrow production documentation. Below is the directory of all specifications and engineering guides:\n\n## Documentation Index\n\n| Specification | Description | Direct Link |\n| :--- | :--- | :--- |\n| **System Architecture** | Smart contract architecture, state machine, backend event indexer with reorg protection, Prisma DB schema, IPFS metadata, and sequence diagrams. | [**`architecture.md`**](file:///Users/nilanjanmondal/blockProjects/docs/architecture.md) |\n| **Design System & Theme** | Institutional Web3 visual identity, semantic escrow states, color tokens, typography scales, Stepper components, and Tailwind config. | [**`theme.md`**](file:///Users/nilanjanmondal/blockProjects/docs/theme.md) |\n| **Production Readiness** | Multi-AZ cloud topology, RPC failover pool, secrets management, static analysis, CI/CD pipeline, and disaster recovery. | [**`prod.md`**](file:///Users/nilanjanmondal/blockProjects/docs/prod.md) |\n| **Tasks & Roadmap** | 6-phase project breakdown, 138 story points, ticket acceptance criteria, and sprint schedule. | [**`tasks.md`**](file:///Users/nilanjanmondal/blockProjects/docs/tasks.md) |\n| **Testing Specification** | Multi-tier testing pyramid, Foundry unit/invariant/fuzz tests, Testcontainers integration, and Synpress E2E tests. | [**`test.md`**](file:///Users/nilanjanmondal/blockProjects/docs/test.md) |\n\n---\n\n## Quick Navigation via Terminal\n\nYou can launch the interactive terminal documentation menu at any time:\n\n```bash\nnpm start\n# or\nnpm run docs\n```\n"};

        .replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold text-[#38BDF8] mt-8 mb-3 pb-2 border-b border-[#2D3A4F]">$1</h2>')
        .replace(/^# (.*$)/gim, '<h1 class="text-2xl font-extrabold text-white mt-4 mb-4">$1</h1>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong class="text-white font-semibold">$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em class="text-[#8B9BB4]">$1</em>')
        .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
        .replace(/`([^\`]+)`/gim, '<code class="mono px-1 py-0.5 rounded bg-[#1A2333] text-[#38BDF8] text-xs">$1</code>')
        .replace(/^\> (.*$)/gim, '<blockquote class="border-l-4 border-[#38BDF8] pl-4 py-1 my-3 bg-[#1A2333]/50 text-slate-300 italic text-xs">$1</blockquote>')
        .replace(/^\- (.*$)/gim, '<li class="ml-4 list-disc text-slate-300 my-1">$1</li>')
        .replace(/\n\n/gim, '<p class="my-3 text-slate-300 leading-relaxed"></p>');
      return html;
    }
